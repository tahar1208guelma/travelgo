version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: travelgo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-travelgo}
    ports:
      - "5432:5432"
    volumes:
      - travelgo_pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: travelgo-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/travelgo
      JWT_SECRET: ${JWT_SECRET:-travelgo_production_jwt_secret_2026}
      COMMISSION_RATE: ${COMMISSION_RATE:-0.0075}
      AMADEUS_CLIENT_ID: ${AMADEUS_CLIENT_ID:-}
      AMADEUS_CLIENT_SECRET: ${AMADEUS_CLIENT_SECRET:-}
      DUFFEL_ACCESS_TOKEN: ${DUFFEL_ACCESS_TOKEN:-}
      BOOKING_COM_API_KEY: ${BOOKING_COM_API_KEY:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      CIB_MERCHANT_KEY: ${CIB_MERCHANT_KEY:-}
    ports:
      - "4000:4000"

volumes:
  travelgo_pgdata:
    driver: local
