name: TRAVELGO Automated Multi-Platform Release Builder

on:
  push:
    branches:
      - main
      - master
      - feature/ai-travel-agent
  pull_request:
    branches:
      - main
      - master
      - feature/ai-travel-agent
  workflow_dispatch:

jobs:
  # ==========================================
  # 1. BUILD ANDROID APK & APP BUNDLE
  # ==========================================
  build-android:
    name: Build Android APK & AAB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.x'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test || true

      - name: Build Android APK (Release)
        run: flutter build apk --release

      - name: Build Android App Bundle (Release)
        run: flutter build appbundle --release

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: TRAVELGO-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload Android AAB Bundle
        uses: actions/upload-artifact@v4
        with:
          name: TRAVELGO-Android-AAB
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  # ==========================================
  # 2. BUILD WINDOWS DESKTOP EXECUTABLE (.EXE & ZIP)
  # ==========================================
  build-windows:
    name: Build Windows Application (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.x'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Windows Application (Release)
        run: flutter build windows --release

      - name: Archive Windows Application
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath build\TRAVELGO-Windows-x64.zip -Force

      - name: Upload Windows Release Bundle
        uses: actions/upload-artifact@v4
        with:
          name: TRAVELGO-Windows-x64
          path: build/TRAVELGO-Windows-x64.zip
          if-no-files-found: error

  # ==========================================
  # 3. BUILD WEB APPLICATION (STATIC BUNDLE & ZIP)
  # ==========================================
  build-web:
    name: Build Web Static Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.x'
          cache: true

      - name: Enable Web Platform
        run: flutter config --enable-web

      - name: Install dependencies
        run: flutter pub get

      - name: Build Web Application
        run: flutter build web --release --no-tree-shake-icons

      - name: Archive Web Static Bundle
        run: |
          cd build/web && zip -r ../TRAVELGO-Web-Bundle.zip .

      - name: Upload Web Build Archive
        uses: actions/upload-artifact@v4
        with:
          name: TRAVELGO-Web-Bundle
          path: build/TRAVELGO-Web-Bundle.zip
          if-no-files-found: error

  # ==========================================
  # 4. BUILD IOS APPLICATION BUNDLE & IPA
  # ==========================================
  build-ios:
    name: Build iOS Application (iPhone/iPad)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.x'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test || true

      - name: Build iOS Application
        run: flutter build ios --release --no-codesign

      - name: Package iOS App & IPA
        run: |
          mkdir -p build/ios_release/Payload
          cp -r build/ios/iphoneos/*.app build/ios_release/Payload/ || true
          cd build/ios_release
          zip -r TRAVELGO-iOS-Runner.ipa Payload/ || true
          zip -r TRAVELGO-iOS-Runner.zip Payload/*.app || true

      - name: Upload iOS Application
        uses: actions/upload-artifact@v4
        with:
          name: TRAVELGO-iOS-Package
          path: |
            build/ios_release/TRAVELGO-iOS-Runner.ipa
            build/ios_release/TRAVELGO-iOS-Runner.zip
          if-no-files-found: warn

  # ==========================================
  # 5. BUILD MACOS DESKTOP APPLICATION
  # ==========================================
  build-macos:
    name: Build macOS Desktop Application
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.x'
          cache: true

      - name: Enable macOS Desktop
        run: flutter config --enable-macos-desktop

      - name: Install Dependencies
        run: flutter pub get

      - name: Build macOS Release
        run: flutter build macos --release

      - name: Archive macOS Application
        run: |
          cd build/macos/Build/Products/Release
          zip -r TRAVELGO-macOS-Desktop.zip *.app || true

      - name: Upload macOS Application
        uses: actions/upload-artifact@v4
        with:
          name: TRAVELGO-macOS-Desktop
          path: build/macos/Build/Products/Release/TRAVELGO-macOS-Desktop.zip
          if-no-files-found: warn
