name: Build Release Executables

on:
  push:
    branches:
      - main
      - feature/ai-travel-agent
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  # ==========================================
  # JOB 1: Build Android APK & App Bundle
  # ==========================================
  build-android:
    name: Build Android APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run unit & widget tests
        run: flutter test

      - name: Build Android APK (Release)
        run: flutter build apk --release

      - name: Build Android App Bundle (AAB)
        run: flutter build appbundle --release

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: travelgo-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload Android Bundle (AAB)
        uses: actions/upload-artifact@v4
        with:
          name: travelgo-android-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  # ==========================================
  # JOB 2: Build Windows Desktop Executable (.exe)
  # ==========================================
  build-windows:
    name: Build Windows Executable (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop
        run: |
          flutter config --enable-windows-desktop
          flutter create --platforms=windows .

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows Application (Release)
        run: flutter build windows --release

      - name: Archive Windows Release Directory
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath build\windows\x64\runner\TRAVELGO-Windows-x64.zip -Force

      - name: Upload Windows Desktop Artifact
        uses: actions/upload-artifact@v4
        with:
          name: travelgo-windows-x64
          path: build\windows\x64\runner\TRAVELGO-Windows-x64.zip
          if-no-files-found: error

  # ==========================================
  # JOB 3: Build Web Application
  # ==========================================
  build-web:
    name: Build Web Static Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Enable Web Platform
        run: |
          flutter config --enable-web
          flutter create --platforms=web .

      - name: Install dependencies
        run: flutter pub get

      - name: Build Web Application
        run: flutter build web --release

      - name: Upload Web Build
        uses: actions/upload-artifact@v4
        with:
          name: travelgo-web-bundle
          path: build/web
          if-no-files-found: error
