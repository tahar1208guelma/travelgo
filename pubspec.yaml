name: travelgo
description: "TRAVELGO - Complete Flight & Hotel Travel Booking Mobile Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # State Management & DI
  flutter_riverpod: ^2.5.1
  
  # Internationalization & Formatting
  intl: ^0.20.3
  
  # UI & Design System
  google_fonts: ^6.2.1
  smooth_page_indicator: ^1.2.0+3
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10+1
  
  # Utilities & Storage
  shared_preferences: ^2.2.3
  uuid: ^4.4.0
  url_launcher: ^6.2.6
  path_provider: ^2.1.2
  share_plus: ^10.0.0
  file_selector: ^1.1.0

  # PDF Generation, Printing & QR Code
  pdf: ^3.11.1
  printing: ^5.13.2
  qr_flutter: ^4.1.0

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/translations/
    - assets/images/
    - assets/icons/

dependency_overrides:
  path_provider_foundation: 2.4.0
